plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.imranrasulzade'
version = '1.1.2'

ext {
    springBootVersion = '4.0.3'
    lombokVersion = '1.18.32'
    servletApiVersion = '6.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {

    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    api "org.springframework:spring-web"

    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework:spring-aop"
    implementation "org.aspectj:aspectjweaver"

    compileOnly "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"
    testImplementation "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.springframework.boot:spring-boot-starter-test-classic"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "exception-core-lib"

            pom {
                name = "exception-core-lib"
                description = "Production-ready exception handling library for Spring Boot 4 (i18n, traceId, AOP logging, auto-configuration)."
                url = "https://github.com/imranrasulzade/exception-core-lib"

                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        id = "imranrasulzade"
                        name = "Imran Rasulzade"
                        email = "rasulzade002@gmail.com"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/imranrasulzade/exception-core-lib.git"
                    developerConnection = "scm:git:ssh://github.com:imranrasulzade/exception-core-lib.git"
                    url = "https://github.com/imranrasulzade/exception-core-lib"
                }
            }
        }
    }

    repositories {
        maven {
            name = "OSSRH"
            url = uri("https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/")
            credentials {
                username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
            }
        }
    }

}

signing {

    def signingKey = findProperty("signingKey") ?: System.getenv("GPG_SIGNING_KEY")
    def signingPassword = findProperty("signingPassword") ?: System.getenv("GPG_SIGNING_PASSWORD")

    if (signingKey != null) {

        useInMemoryPgpKeys(
                signingKey.toString().replace("\\n", "\n"),
                signingPassword ?: ""
        )

        sign publishing.publications.mavenJava

    } else {

        useGpgCmd()
        sign publishing.publications.mavenJava

    }
}

tasks.withType(Javadoc).configureEach {

    options.encoding = "UTF-8"
    options.addStringOption("Xdoclint:none", "-quiet")

    failOnError = false
}